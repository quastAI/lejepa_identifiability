[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idtb"
version = "0.1.0"
description = "Isaac Sim identifiability testbed: OU-sampled pairs with known Gaussian latents"
# Isaac Sim 6.0.0 is built against Python 3.12 (README §3.1) -- its wheels declare
# `requires_python == 3.12.*`. Deliberately a floor and not an equality: the pure
# tier-0 layers have to stay runnable on whatever local interpreter is to hand.
requires-python = ">=3.12"
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
# usd-core is the standalone Pixar-USD PyPI package (real `pxr`, no
# Omniverse Kit/SimulationApp needed) -- it authors and reads back
# `idtb.scenegen`'s scene files locally, unlike everything Isaac-runtime
# (README §1's "no local development loop" doesn't apply to raw USD
# authoring). Its OpenUSD build version is not guaranteed to match Isaac
# Sim 6.0.1's bundled `pxr` bit-for-bit; the pod session in docs/PLAN.md
# Phase 2 is what actually confirms the authored `.usda` opens there.
dev = ["pytest", "ruff", "usd-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/idtb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "-m", "not isaac"]
markers = ["isaac: needs a live Isaac Sim runtime; pod only, deselected by default"]

[tool.ruff]
line-length = 100
# Prose, not source: the formatter otherwise rewrites snippets inside code fences.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# TID253. SimulationApp must exist before any of these are imported (README §4.2),
# so sim-touching modules import them inside functions. A module-level import here
# kills pytest at collection time -- on a machine where Isaac cannot be installed.
banned-module-level-imports = ["isaacsim", "isaaclab", "omni", "carb", "pxr"]
